<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURUM</title>
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AURUM" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />

  <!-- Clerk Auth -->
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_live_Y2xlcmsudHJ5YXVydW0uc3RvcmUk"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"
  ></script>

  <style>
    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: var(--max-width);
      margin: 0 auto;
      position: relative;
    }

    .app-bar {
      position: sticky;
      top: 0;
      z-index: var(--z-sticky);
      height: var(--nav-height);
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-4);
    }

    .app-bar-logo {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: var(--weight-light);
      letter-spacing: 0.15em;
      color: var(--color-gold);
    }

    .app-bar-right {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .app-bar-score {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .app-bar-score-value {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--color-gold);
      line-height: 1;
    }

    .app-bar-score-label {
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }

    .page-content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: var(--bottom-nav-h);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: var(--max-width);
      z-index: var(--z-sticky);
      height: var(--bottom-nav-h);
      background: rgba(17,17,17,0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 var(--space-2);
    }

    #auth-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8) var(--space-4);
      max-width: var(--max-width);
      margin: 0 auto;
    }

    .auth-logo {
      font-family: var(--font-display);
      font-size: var(--text-5xl);
      font-weight: var(--weight-light);
      letter-spacing: 0.2em;
      color: var(--color-gold);
      text-transform: uppercase;
      margin-bottom: var(--space-2);
      animation: goldShimmer 3s ease-in-out infinite;
    }

    .auth-tagline {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      letter-spacing: 0.08em;
      margin-bottom: var(--space-10);
      text-align: center;
    }

    .auth-tabs {
      display: flex;
      width: 100%;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: var(--space-8);
    }

    .auth-tab {
      flex: 1;
      padding: var(--space-3);
      text-align: center;
      font-size: var(--text-sm);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all var(--transition-base);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      background: none;
      border-left: none;
      border-right: none;
      border-top: none;
    }

    .auth-tab.active {
      color: var(--color-gold);
      border-bottom-color: var(--color-gold);
    }

    .auth-form-panel {
      display: none;
      width: 100%;
    }

    .auth-form-panel.active {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .auth-footer {
      margin-top: var(--space-8);
      text-align: center;
      font-size: var(--text-xs);
      color: var(--color-text-dim);
      line-height: 1.8;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: var(--color-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: var(--space-4);
      z-index: 9999;
    }

    .loading-logo {
      font-family: var(--font-display);
      font-size: var(--text-4xl);
      font-weight: var(--weight-light);
      letter-spacing: 0.2em;
      color: var(--color-gold);
      animation: goldShimmer 2s ease-in-out infinite;
    }

    .loading-bar {
      width: 120px;
      height: 1px;
      background: var(--color-border);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .loading-bar-fill {
      height: 100%;
      background: var(--color-gold);
      border-radius: var(--radius-full);
      animation: loadingFill 1.5s ease forwards;
    }

    @keyframes loadingFill {
      from { width: 0%; }
      to   { width: 100%; }
    }

    .page-view {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .page-view.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <p class="loading-logo">AURUM</p>
    <div class="loading-bar">
      <div class="loading-bar-fill"></div>
    </div>
  </div>

  <!-- Auth Screen -->
  <div id="auth-screen" style="display:none;">
    <p class="auth-logo">AURUM</p>
    <p class="auth-tagline">Where ambition meets competition.</p>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="signin">Sign In</button>
      <button class="auth-tab" data-tab="signup">Join AURUM</button>
    </div>

    <!-- Sign In -->
    <div class="auth-form-panel active" id="panel-signin">
      <div class="input-group">
        <label class="input-label">Email</label>
        <input class="input" type="email" id="signin-email" placeholder="your@email.com" />
      </div>
      <div class="input-group">
        <label class="input-label">Password</label>
        <input class="input" type="password" id="signin-password" placeholder="••••••••" />
      </div>
      <button class="btn btn-primary btn-full" id="btn-signin">Enter AURUM</button>
      <p id="signin-error" style="color:var(--color-danger);font-size:var(--text-sm);text-align:center;display:none;"></p>
    </div>

    <!-- Sign Up -->
    <div class="auth-form-panel" id="panel-signup">
      <div class="input-group">
        <label class="input-label">Username</label>
        <input class="input" type="text" id="signup-username" placeholder="YourHandle" />
      </div>
      <div class="input-group">
        <label class="input-label">Email</label>
        <input class="input" type="email" id="signup-email" placeholder="your@email.com" />
      </div>
      <div class="input-group">
        <label class="input-label">Password</label>
        <input class="input" type="password" id="signup-password" placeholder="Min. 8 characters" />
      </div>
      <button class="btn btn-primary btn-full" id="btn-signup">Claim Your Spot</button>
      <p id="signup-error" style="color:var(--color-danger);font-size:var(--text-sm);text-align:center;display:none;"></p>
    </div>

    <p class="auth-footer">
      By joining you agree to our Terms of Service.<br/>
      AURUM is a Delaware LLC. All transactions are secured.
    </p>
  </div>

  <!-- App Shell -->
  <div id="app-shell" class="app-shell" style="display:none;">

    <div class="app-bar">
      <span class="app-bar-logo">AURUM</span>
      <div class="app-bar-right">
        <div class="app-bar-score">
          <span class="app-bar-score-value" id="user-score">—</span>
          <span class="app-bar-score-label">Aurum Score</span>
        </div>
        <div class="avatar avatar-sm avatar-gold" id="user-avatar">—</div>
      </div>
    </div>

    <div class="page-content">
      <div class="page-view active" id="view-ledger"></div>
      <div class="page-view" id="view-arena"></div>
      <div class="page-view" id="view-leaderboard"></div>
      <div class="page-view" id="view-profile"></div>
      <div class="page-view" id="view-elite"></div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-item active" data-view="ledger">
        <svg viewBox="0 0 24 24"><path d="M9 12h6M9 16h6M9 8h6M5 4h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1z"/></svg>
        Ledger
      </button>
      <button class="nav-item" data-view="arena">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        Arena
      </button>
      <button class="nav-item" data-view="leaderboard">
        <svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        Board
      </button>
      <button class="nav-item" data-view="profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        Profile
      </button>
      <button class="nav-item" data-view="elite">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        Elite
      </button>
    </nav>

  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/pages/ledger.js"></script>
  <script src="js/pages/arena.js"></script>
  <script src="js/pages/leaderboard.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/elite-rooms.js"></script>

  <script>
  /* ============================================
     AURUM App Shell — Auth + Routing
  ============================================ */

  const App = {
    user: null,
    currentView: 'ledger',

    async init() {
      await this.waitForClerk();
      await this.checkAuth();
      this.hideLoading();
    },

    waitForClerk() {
      return new Promise(resolve => {
        const tryLoad = () => {
          if (window.Clerk) {
            window.Clerk.load()
              .then(resolve)
              .catch(resolve);
          } else {
            setTimeout(tryLoad, 100);
          }
        };
        tryLoad();
        /* Hard timeout — never hang forever */
        setTimeout(resolve, 8000);
      });
    },

    async checkAuth() {
      try {
        /* If there's an active session, go straight to app */
        if (Clerk.session) {
          const token = await Clerk.session.getToken();
          if (token) {
            AURUM.Auth.setToken(token);
            this.user = Clerk.user;
            await this.loadUserProfile();
            this.showApp();
            return;
          }
        }
        this.showAuth();
      } catch (err) {
        console.warn('checkAuth error:', err);
        this.showAuth();
      }
    },

    async loadUserProfile() {
      try {
        const data = await AURUM.AuthAPI.me();
        this.user = { ...this.user, ...data.user };
        this.updateAppBar();
      } catch (err) {
        /* Worker might not have user yet — use Clerk data */
        if (this.user) {
          this.updateAppBar();
        }
      }
    },

    updateAppBar() {
      const score = document.getElementById('user-score');
      const avatar = document.getElementById('user-avatar');
      const username = this.user?.username
        || this.user?.firstName
        || this.user?.emailAddresses?.[0]?.emailAddress?.split('@')[0]
        || '?';

      if (score) {
        score.textContent = AURUM.formatNumber(this.user?.aurum_score || 0);
      }
      if (avatar) {
        avatar.textContent = username.charAt(0).toUpperCase();
      }
    },

    hideLoading() {
      const el = document.getElementById('loading-screen');
      if (el) {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.4s ease';
        setTimeout(() => el.remove(), 400);
      }
    },

    showAuth() {
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('app-shell').style.display = 'none';
      if (location.hash === '#signup') {
        document.querySelector('[data-tab="signup"]')?.click();
      }
    },

    showApp() {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-shell').style.display = 'flex';
      this.navigate('ledger');
    },

    navigate(view) {
      document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

      const viewEl = document.getElementById(`view-${view}`);
      const navEl = document.querySelector(`[data-view="${view}"]`);
      if (viewEl) viewEl.classList.add('active');
      if (navEl) navEl.classList.add('active');

      this.currentView = view;
      this.loadView(view);
    },

    loadView(view) {
      const loaders = {
        ledger:      () => window.LedgerPage?.init('view-ledger'),
        arena:       () => window.ArenaPage?.init('view-arena'),
        leaderboard: () => window.LeaderboardPage?.init('view-leaderboard'),
        profile:     () => window.ProfilePage?.init('view-profile', App.user),
        elite:       () => window.ElitePage?.init('view-elite')
      };
      loaders[view]?.();
    }
  };

  /* --- Bottom nav --- */
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => App.navigate(btn.dataset.view));
  });

  /* --- Auth tab switching --- */
  document.querySelectorAll('.auth-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(`panel-${tab.dataset.tab}`).classList.add('active');
    });
  });

  /* --- Sign In --- */
  document.getElementById('btn-signin').addEventListener('click', async () => {
    const email = document.getElementById('signin-email').value.trim();
    const password = document.getElementById('signin-password').value;
    const errEl = document.getElementById('signin-error');
    const btn = document.getElementById('btn-signin');

    errEl.style.display = 'none';

    if (!email || !password) {
      errEl.textContent = 'Email and password are required.';
      errEl.style.display = 'block';
      return;
    }

    btn.textContent = 'Entering...';
    btn.disabled = true;

    try {
      const signInAttempt = await Clerk.client.signIn.create({
        identifier: email,
        password
      });

      if (signInAttempt.status === 'complete') {
        await Clerk.setActive({ session: signInAttempt.createdSessionId });
        const token = await Clerk.session.getToken();
        AURUM.Auth.setToken(token);
        App.user = Clerk.user;
        await App.loadUserProfile();
        App.showApp();
      } else {
        errEl.textContent = 'Sign in incomplete. Please try again.';
        errEl.style.display = 'block';
        console.warn('SignIn status:', signInAttempt.status);
      }

    } catch (err) {
      console.error('SignIn error:', err);
      const message = err.errors?.[0]?.longMessage
        || err.errors?.[0]?.message
        || err.message
        || 'Sign in failed.';
      errEl.textContent = message;
      errEl.style.display = 'block';
    } finally {
      btn.textContent = 'Enter AURUM';
      btn.disabled = false;
    }
  });

  /* --- Sign Up --- */
  document.getElementById('btn-signup').addEventListener('click', async () => {
    const username = document.getElementById('signup-username').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const errEl = document.getElementById('signup-error');
    const btn = document.getElementById('btn-signup');

    errEl.style.display = 'none';

    if (!username || !email || !password) {
      errEl.textContent = 'All fields are required.';
      errEl.style.display = 'block';
      return;
    }

    if (password.length < 8) {
      errEl.textContent = 'Password must be at least 8 characters.';
      errEl.style.display = 'block';
      return;
    }

    btn.textContent = 'Claiming your spot...';
    btn.disabled = true;

    try {
      const signUpAttempt = await Clerk.client.signUp.create({
        emailAddress: email,
        password: password,
        username: username
      });

      console.log('SignUp status:', signUpAttempt.status);

      if (signUpAttempt.status === 'complete') {
        await Clerk.setActive({ session: signUpAttempt.createdSessionId });
        const token = await Clerk.session.getToken();
        AURUM.Auth.setToken(token);
        App.user = Clerk.user;

        /* Register in Worker — non-blocking */
        try {
          await AURUM.AuthAPI.register({ username, email });
        } catch (workerErr) {
          console.warn('Worker registration failed:', workerErr.message);
        }

        App.showApp();

      } else if (signUpAttempt.status === 'missing_requirements') {
        errEl.textContent = 'Please check your details and try again.';
        errEl.style.display = 'block';
        console.warn('Missing requirements:', signUpAttempt.missingFields);

      } else {
        errEl.textContent = 'Signup incomplete: ' + signUpAttempt.status;
        errEl.style.display = 'block';
      }

    } catch (err) {
      console.error('SignUp error:', err);
      const message = err.errors?.[0]?.longMessage
        || err.errors?.[0]?.message
        || err.message
        || 'Registration failed.';
      errEl.textContent = message;
      errEl.style.display = 'block';
    } finally {
      btn.textContent = 'Claim Your Spot';
      btn.disabled = false;
    }
  });

  /* --- Boot --- */
  window.addEventListener('load', () => App.init());
  </script>

</body>
</html>
